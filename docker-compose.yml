version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cordlyx-postgres
    environment:
      POSTGRES_USER: cordlyx
      POSTGRES_PASSWORD: cordlyx
      POSTGRES_DB: cordlyx
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/drizzle/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cordlyx']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cordlyx-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
