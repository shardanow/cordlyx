name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

env:
  NODE_VERSION: "22"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cordlyx
          POSTGRES_PASSWORD: cordlyx
          POSTGRES_DB: cordlyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - run: npm run build -w packages/shared

      - name: Lint
        run: npm run lint

      - name: Push schema
        run: psql "$DATABASE_URL" < backend/schema.sql
        env:
          DATABASE_URL: postgres://cordlyx:cordlyx@localhost:5432/cordlyx_test

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgres://cordlyx:cordlyx@localhost:5432/cordlyx_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret

      - name: Build
        run: npm run build
