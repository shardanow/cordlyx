name: Deploy

# Production deploy: runs only after CI succeeds on main/master.
# Flow: feature/* -> PR -> dev (CI) -> PR -> main (CI green) -> auto-deploy.
# Rollback: Actions -> Deploy -> Run workflow -> ref = previous SHA.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch or SHA; previous SHA = rollback)"
        required: false
        default: "main"

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            PROJECT_DIR="${{ secrets.DEPLOY_PATH }}"
            [ -z "$PROJECT_DIR" ] && PROJECT_DIR="$HOME/cordlyx"
            REF="${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            cd "$PROJECT_DIR"
            PREV_SHA="$(git rev-parse HEAD)"
            git fetch origin
            if [ "$REF" = "main" ] || [ "$REF" = "master" ]; then
              git checkout "$REF"
              git pull --ff-only
            else
              git fetch origin "$REF"
              git checkout --detach FETCH_HEAD
            fi
            echo "Deployed ref: $(git rev-parse --short HEAD) (previous: $(git rev-parse --short "$PREV_SHA"))"

            # Backup DB before touching running services. HARD GATE:
            # no fresh dump = stop here, nothing else runs.
            DEPLOY_START="$(date +%s)"
            ./backup/backup.sh --db
            DUMP="$(ls -t backups/dump_*.sql 2>/dev/null | head -1)"
            [ -n "${DUMP:-}" ] && [ -s "$DUMP" ] && [ "$(stat -c %Y "$DUMP")" -ge "$DEPLOY_START" ] \
              || { echo "backup gate failed: no fresh dump in backups/"; exit 1; }
            echo "Backup gate OK: $DUMP ($(du -h "$DUMP" | cut -f1))"

            # Apply pending DB migrations BEFORE new code starts.
            # migrate.sh is idempotent; any failure stops the deploy here
            # while the old code+schema keeps serving.
            COMPOSE_FILE=docker-compose.prod.yml ./scripts/migrate.sh

            $COMPOSE up -d --build

            # nginx.conf is bind-mounted: `up` does not recreate nginx on
            # config changes, leaving a stale mount (no /health location).
            # Force-recreate remounts it (~1-2s blip, acceptable here).
            $COMPOSE up -d --force-recreate nginx

            echo "Waiting for PostgreSQL..."
            for i in $(seq 1 30); do
              if $COMPOSE exec -T postgres pg_isready -U cordlyx >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            $COMPOSE exec -T postgres pg_isready -U cordlyx

            wait_health() {
              for i in $(seq 1 45); do
                if curl --fail --max-time 5 http://localhost:3005/health >/dev/null 2>&1; then
                  echo "API healthy"
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            echo "Waiting for API health..."
            if ! wait_health; then
              echo "=== api logs ==="
              $COMPOSE logs --tail 30 api || true
              echo "=== nginx logs ==="
              $COMPOSE logs --tail 15 nginx || true
              # AUTO-ROLLBACK: new code is unhealthy — go back to the
              # previously serving ref and rebuild, no human needed.
              echo "Health gate failed — rolling back to $PREV_SHA"
              git checkout --detach "$PREV_SHA"
              $COMPOSE up -d --build
              $COMPOSE up -d --force-recreate nginx
              if wait_health; then
                echo "Rollback healthy on $PREV_SHA"
              else
                echo "Rollback ALSO unhealthy — DB dump available at $DUMP, needs investigation"
              fi
              exit 1
            fi
            $COMPOSE ps
